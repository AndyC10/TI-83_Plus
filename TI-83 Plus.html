const r=expr();if(p<t.length)throw'SYNTAX';return r}
const isM=Array.isArray,isMt=s=>/^\[[A-J]\]$/.test(s||''),Mx={},NM='ABCDEFGHIJ';for(const c of NM)Mx[c]=[];
let MT=0,mxs=0,mb='home',E={n:'A',i:-1,j:0},eb=[],fresh=0;
const dm=(a,b)=>{if(a.length!==b.length||a[0].length!==b[0].length)throw'DIM MISMATCH'},
neg=v=>isM(v)?v.map(r=>r.map(x=>-x)):-v,
add=(a,b,s=1)=>{if(isM(a)&&isM(b)){dm(a,b);return a.map((r,i)=>r.map((x,j)=>x+s*b[i][j]))}if(isM(a)||isM(b))throw'DATA TYPE';return a+s*b},
mul=(a,b)=>{if(!isM(a)&&!isM(b))return a*b;if(!isM(a))return b.map(r=>r.map(x=>x*a));if(!isM(b))return a.map(r=>r.map(x=>x*b));if(a[0].length!==b.length)throw'DIM MISMATCH';return a.map(r=>b[0].map((_,j)=>r.reduce((s,x,k)=>s+x*b[k][j],0)))},
tp=m=>{if(!isM(m))throw'DATA TYPE';return m[0].map((_,j)=>m.map(r=>r[j]))},
idn=n=>Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>+(i===j))),
ck=(m,...r)=>{if(!isM(m)||r.some(x=>!m[x-1]))throw'DOMAIN'},
rw=(m,k,a,b)=>{ck(m,a,b);m=m.map(r=>r.slice());m[b-1]=m[b-1].map((x,j)=>x+k*m[a-1][j]);return m},
inv=v=>isM(v)?minv(v):1/v;
function rr(m,full){if(!isM(m))throw'DATA TYPE';m=m.map(r=>r.slice());const R=m.length,C=m[0].length;let r=0;
for(let c=0;c<C&&r<R;c++){let p=r;for(let i=r+1;i<R;i++)if(Math.abs(m[i][c])>Math.abs(m[p][c]))p=i;if(Math.abs(m[p][c])<1e-12)continue;[m[r],m[p]]=[m[p],m[r]];const d=m[r][c];m[r]=m[r].map(x=>x/d);

function det(m){if(!isM(m)||m.length!==m[0].length)throw'DIMENSION';m=m.map(r=>r.slice());let d=1;const n=m.length;
for(let c=0;c<n;c++){let p=c;for(let i=c+1;i<n;i++)if(Math.abs(m[i][c])>Math.abs(m[p][c]))p=i;if(Math.abs(m[p][c])<1e-12)return 0;if(p!==c){[m[p],m[c]]=[m[c],m[p]];d=-d}d*=m[c][c];

function minv(m){if(m.length!==m[0].length)throw'DIMENSION';const n=m.length,I=idn(n),R=rr(m.map((r,i)=>r.concat(I[i])),1);if(R.some((r,i)=>r[i]!==1))throw'SINGULAR MAT';return R.map(r=>r.slice(n))}
function pwr(v,e){if(!isM(v)){if(isM(e))throw'DATA TYPE';return v**e}if(isM(e)||!Number.isInteger(e)||v.length!==v[0].length)throw'DOMAIN';const b=e<0?minv(v):v;let r=idn(v.length);for(let i=0;i<Math.abs(e);i++)r=mul(r,b);return r}
const mfmt=m=>m.map((r,i)=>{const s=(i?' ':'[')+'['+r.map(fmt).join(' ')+']'+(i===m.length-1?']':'');return{l:s.length>16?s.slice(0,15)+'▶':s}});
const MF=['det(','T','dim(','Fill(','identity(','randM(','augment(','Matr▶list(','List▶matr(','cumSum(','ref(','rref(','rowSwap(','row+(','*row(','*row+('],MCH='1234567890ABCDEF',mxn=()=>MT===1?16:10,

function mxr(){const n=mxn(),top=Math.max(0,Math.min(mxs-3,n-7)),o=[['NAMES','MATH','EDIT'].map((x,i)=>i===MT?`<b class="cur">${x}</b>`:x).join(' ')];
for(let i=top;i<Math.min(n,top+7);i++){const ch=MCH[i],nm=MT===1?MF[i]:'['+NM[i]+']';o.push((i===mxs?`<b class="cur">${ch}</b>`:ch)+':'+(MT===1?nm:nm.padEnd(6)+dimS(NM[i])))}return o.join('\n')}
function mload(){const m=Mx[E.n],v=E.i<0?(E.j?(m[0]||[]).length:m.length):m[E.i][E.j];eb=toks(fmt(v));cur=eb.length;fresh=1}
function msel(i){if(MT===2){E={n:NM[i],i:Mx[NM[i]].length?0:-1,j:0};mode='medit';mload()}
else{mode=mb;cur=Math.min(cur,ed().length);ed().splice(cur,0,MT===1?(MF[i]==='T'?'ᵀ':MF[i]):'['+NM[i]+']');cur++}draw()}
function mnav(id){const m=Mx[E.n],R=m.length,C=R?m[0].length:0;
if(id==='u'){if(E.i>=0){E.i--;if(E.i<0)E.j=0}}else if(id==='dn'){if(E.i<0){if(R){E.i=0;E.j=0}}else if(E.i<R-1)E.i++}

function mer(){const m=Mx[E.n],R=m.length,C=R?m[0].length:0,hl=(t,f)=>f?`<b class="cur">${t}</b>`:t,
o=['MATRIX['+E.n+'] '+hl(R,E.i<0&&!E.j)+' ×'+hl(C,E.i<0&&E.j)],top=Math.max(0,E.i-5),lf=Math.max(0,E.j-2);

plot();const c=$('#g').getContext('2d'),ox=V.X;V.X=x0+tx*(x1-x0)/94;let y;try{y=ev(Ys.t[tf])}catch(e){y=NaN}

function menu(title,items){mm={title,items,sel:0};mode='menu';draw()}
function enterHome(){const t=buf.slice();if(!t.length)return;hist.push({l:t.join('')});last=t;
try{let i=t.lastIndexOf('→'),dest,e=t;if(i>=0){dest=t[i+1];e=t.slice(0,i);if(!(isV(dest)||isMt(dest))||t.length!==i+2)throw'SYNTAX'}
const v=ev(e);if(isM(v)){if(dest&&!isMt(dest))throw'DATA TYPE';ans=v;if(dest)Mx[dest[1]]=v.map(r=>r.slice());hist.push(...mfmt(v))}else{if(!isFinite(v))throw'DOMAIN';if(dest&&isMt(dest))throw'DATA TYPE';ans=v;if(dest)V[dest]=v;hist.push({r:fmt(v)})}}
catch(x){hist.push({l:'ERR:'+(typeof x==='string'?x:'SYNTAX')})}
if(hist.length>60)hist.splice(0,20);buf=[];cur=0}
function arrow(id){const d={u:-1,dn:1,l:-1,r:1}[id],v=id==='u'||id==='dn',cl=a=>Math.max(0,Math.min(a.length,cur+d));
if(mode==='home'){if(v){if(id==='u'&&!buf.length&&last.length){buf=last.slice();cur=buf.length}}else cur=cl(buf)}
else if(mode==='list'){if(v){L.i=(L.i+d+4)%4;cur=L.t[L.i].length}else cur=cl(L.t[L.i])}
else if(mode==='menu'){if(v)mm.sel=(mm.sel+d+mm.items.length)%mm.items.length}
else if(mode==='mx'){if(v)mxs=(mxs+d+mxn())%mxn();else{MT=(MT+d+3)%3;mxs=0}}
else if(mode==='medit')mnav(id);
else if(mode==='table'){if(v)t0+=d}
else if(mode==='graph'){if(tr){if(v){for(let n=0;n<4;n++){tf=(tf+d+4)%4;if(Ys.t[tf].length)break}}else tx=Math.max(0,Math.min(94,tx+d))}
else{const w=x1-x0,hh=y1-y0;if(v){y0-=d*hh/10;y1-=d*hh/10}else{x0+=d*w/10;x1+=d*w/10}setWin();plot()}
if(tr)return trace()}
draw()}
function press(id){const s2=S2,al=A;S2=A=0;
if(off){if(id==='on'&&!s2)off=0;return draw()}
if(id==='2nd'){S2=!s2;return draw()}
if(id==='alpha'){A=!al;return draw()}
if(mode==='mx'){const a=KM[id].a;let k=al?'ABCDEF'.indexOf(a||'-'):'1234567890'.indexOf(id);if(al&&k>=0)k+=10;if(k>=0&&k<mxn())return msel(k)}
if(id==='on'){if(s2)off=1;return draw()}
if(id==='mode'){if(!s2){deg=!deg;hist.push({l:deg?'DEGREE MODE':'RADIAN MODE'})}mode='home';return draw()}
if(['u','dn','l','r'].includes(id))return arrow(id);
if(id==='inv'&&s2){mb=mode==='list'?'list':'home';MT=0;mxs=0;mode='mx';return draw()}
if(id==='y'||id==='win'){L=id==='y'?Ys:Wn;L.i=0;mode='list';cur=L.t[0].length;return draw()}
if(id==='graph'){if(s2){mode='table';t0=0;return draw()}return void graph()}
if(id==='zoom'){const w=(x1-x0)/2,h=(y1-y0)/2,cx=(x0+x1)/2,cy=(y0+y1)/2;
return menu('ZOOM',[['ZStandard',()=>zoom(-10,10,-10,10)],['ZDecimal',()=>zoom(-4.7,4.7,-3.1,3.1)],['Zoom In',()=>zoom(cx-w/2,cx+w/2,cy-h/2,cy+h/2)],['Zoom Out',()=>zoom(cx-w*2,cx+w*2,cy-h*2,cy+h*2)]])}
if(id==='trace'){if(mode!=='graph'&&!graph())return;tr=1;return trace()}
if(id==='math')return menu('MATH',['abs(','round(','int(','iPart(','fPart(','min(','max('].map(t=>[t,()=>{mode='home';ed().splice(cur,0,t);cur++}]));
if(id==='clear'){if(mode==='home'){if(buf.length){buf=[];cur=0}else hist=[]}else if(mode==='list'){L.t[L.i]=[];cur=0}else mode='home';return draw()}
if(id==='enter'){if(mode==='mx')return msel(mxs);if(mode==='medit'){mcommit();return draw()}
if(mode==='menu'){mm.items[mm.sel][1]();return draw()}
if(mode==='list'){L.i=(L.i+1)%4;cur=L.t[L.i].length;return draw()}
if(mode!=='home'){mode='home';return draw()}
if(s2){buf=last.slice();cur=buf.length}else enterHome();return draw()}
if(mode==='menu'){if(/^[1-9]$/.test(id)&&+id<=mm.items.length){mm.sel=id-1;mm.items[mm.sel][1]();draw()}return}
if(mode==='graph'||mode==='table')mode='home';
if(id==='del'){const a=ed();if(cur<a.length)a.splice(cur,1);return draw()}
const t=al?(isV(KM[id].a)?KM[id].a:null):s2?S[id]:M[id];
if(t){if(mode==='medit'&&fresh){eb=[];cur=0;fresh=0}ed().splice(cur,0,t);cur++}draw()}
$('#k').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;navigator.vibrate&&navigator.vibrate(6);press(b.dataset.k)});
draw();
</script></body></html>
