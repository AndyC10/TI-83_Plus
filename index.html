<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1c1f">
<title>TI-83 Plus</title>
<style>
:root{
  --bg:#c9c9c9;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f}}
:root[data-theme="dark"]{--bg:#0e0e0f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:system-ui,-apple-system,sans-serif;
}
#c{
  width:min(100%,430px);
  background:linear-gradient(175deg,#25272b 0%,#1b1c1f 35%,#141518 100%);
  border-radius:30px 30px 58px 58px;
  padding:13px 15px 28px;
  color:#fff;
  margin:8px;
  border:2px solid #0d0e10;
  box-shadow:
    0 20px 44px rgba(0,0,0,.55),
    inset 0 2px 2px rgba(255,255,255,.12),
    inset 0 -5px 10px rgba(0,0,0,.65);
}
.plate{
  background:linear-gradient(180deg,#b7beb0 0%,#a7aea0 100%);
  border-radius:12px 12px 24px 24px;
  padding:8px 11px 13px;
  border:1px solid #6b7066;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    0 2px 4px rgba(0,0,0,.5);
}
.hd{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font:700 clamp(11px,3.5vw,16px) Georgia,"Times New Roman",serif;
  color:#262924;
  letter-spacing:.3px;
  margin-bottom:6px;
  padding:0 2px;
}
.hd .model{
  font-family:system-ui,-apple-system,sans-serif;
  font-weight:800;
  letter-spacing:.2px;
}
.hd .model em{
  font-style:italic;
  color:#2c2f2a;
}
.lcd-frame{
  background:#1f2124;
  border-radius:6px;
  padding:3px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.35);
}
.lcd{
  position:relative;
  aspect-ratio:3/2;
  background:#b9c7a6;
  background-image:
    linear-gradient(rgba(30,42,28,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(30,42,28,.045) 1px,transparent 1px);
  background-size:2px 2px;
  border:3px solid #222520;
  border-radius:3px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.32);
  container-type:inline-size;
  overflow:hidden;
}
#s,#tr{
  margin:0;
  font:10.1cqw/.83 ui-monospace,Menlo,Consolas,"Courier New",monospace;
  color:#1e2a1c;
  white-space:pre;
  letter-spacing:-.01em;
}
#g{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  image-rendering:pixelated;
  display:none;
}
#tr{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:rgba(185,199,166,.92);
  display:none;
}
.cur{background:#1e2a1c;color:#b9c7a6;font-weight:400}
.bk{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{background:transparent;color:#1e2a1c}}
.cur.ul{animation:none;background:none;color:#1e2a1c;border-bottom:3px solid #1e2a1c}
.off #s,.off #g,.off #tr{visibility:hidden}

#k{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px 8px;
  margin-top:14px;
  padding:0 2px;
}
.k{
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  min-width:0;
}
.l{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  font:700 clamp(7.5px,2.3vw,10.5px) system-ui,-apple-system,sans-serif;
  height:1.55em;
  white-space:nowrap;
  margin-bottom:2px;
  padding:0 2px;
  letter-spacing:-.2px;
}
.l i{font-style:normal;color:#e6dc4e}
.l u{text-decoration:none;color:#5fd0b4}
button{
  height:clamp(28px,7.6vw,38px);
  width:100%;
  border:1px solid #111214;
  border-radius:9px 9px 12px 12px;
  font:700 clamp(9.5px,2.9vw,13.5px) system-ui,-apple-system,sans-serif;
  color:#f5f6f8;
  background:linear-gradient(180deg,#34363a 0%,#26272b 100%);
  box-shadow:0 3px 0 #09090b,inset 0 1px 0 rgba(255,255,255,.18);
  padding:0;
  cursor:pointer;
}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #09090b}
button.topf{
  height:clamp(22px,5.8vw,28px);
  border-radius:7px 7px 9px 9px;
  font-size:clamp(8.5px,2.5vw,11.5px);
}
.b{background:linear-gradient(180deg,#57679e 0%,#455282 100%)}
.o{background:linear-gradient(180deg,#f7b23b 0%,#e09219 100%);color:#141414}
.t{background:linear-gradient(180deg,#49c2b0 0%,#349e8e 100%);color:#101c1a}
.w{
  background:linear-gradient(180deg,#f0ede4 0%,#dedad0 100%);
  color:#141517;
  font-size:clamp(15px,4.8vw,21px);
  height:clamp(34px,9.2vw,44px);
}
.dp{
  grid-column:4/6;
  grid-row:2/4;
  position:relative;
  min-height:86px;
  background:radial-gradient(circle at center,#24262b 0%,#16171a 72%,transparent 74%);
  border-radius:50%;
}
.dp button{
  position:absolute;
  width:42%;
  height:40%;
  border-radius:50%;
  background:linear-gradient(180deg,#57679e 0%,#455282 100%);
  font-size:clamp(10px,2.8vw,13px);
}
</style>
</head>
<body>
<div id="c">
  <div class="plate">
    <div class="hd">
      <span>TEXAS INSTRUMENTS</span>
      <span class="model">TI-83 <em>Plus</em></span>
    </div>
    <div class="lcd-frame">
      <div class="lcd">
        <pre id="s"></pre>
        <canvas id="g" width="96" height="64"></canvas>
        <pre id="tr"></pre>
      </div>
    </div>
  </div>
  <div id="k"></div>
</div>

<script>
const $=q=>document.querySelector(q);
const D=`y|Y=|STAT PLOT|F1|b topf
win|WINDOW|TBLSET|F2|b topf
zoom|ZOOM|FORMAT|F3|b topf
trace|TRACE|CALC|F4|b topf
graph|GRAPH|TABLE|F5|b topf
2nd|2nd|||o
mode|MODE|QUIT||
del|DEL|INS||
alpha|ALPHA|A-LOCK||t
xt|X,T,θ,n|LINK||
stat|STAT|LIST||
math|MATH|TEST|A|
apps|APPS|ANGLE|B|b
prgm|PRGM|DRAW|C|
vars|VARS|DISTR||
clear|CLEAR|||
inv|x⁻¹|MATRX|D|
sin|SIN|SIN⁻¹|E|
cos|COS|COS⁻¹|F|
tan|TAN|TAN⁻¹|G|
pow|^|π|H|
x2|x²|√|I|
comma|,|EE|J|
lp|(|{|K|
rp|)|}|L|
div|÷|e|M|b
log|LOG|10ˣ|N|
7|7|u|O|w
8|8|v|P|w
9|9|w|Q|w
mul|×|[|R|b
ln|LN|eˣ|S|
4|4|L4|T|w
5|5|L5|U|w
6|6|L6|V|w
sub|−|]|W|b
sto|STO▸|RCL|X|
1|1|L1|Y|w
2|2|L2|Z|w
3|3|L3|θ|w
add|+|MEM|"|b
on|ON|OFF||
0|0|CATALOG|␣|w
dot|.|i|:|w
neg|(−)|ANS|?|w
enter|ENTER|ENTRY|SOLVE|b`;

const KM={};let H='';
D.split('\n').forEach((r,i)=>{
  const[id,m,s,a,c]=r.split('|');
  KM[id]={a};
  H+=`<div class="k"><div class="l"><i>${s}</i><u>${a}</u></div><button class="${c}" data-k="${id}">${m}</button></div>`;
  if(i===7)H+=`<div class="dp"><button data-k="u" style="left:29%;top:2%">▲</button><button data-k="dn" style="left:29%;bottom:2%">▼</button><button data-k="l" style="left:2%;top:30%">◀</button><button data-k="r" style="right:2%;top:30%">▶</button></div>`;
});
$('#k').innerHTML=H;

const M={sin:'sin(',cos:'cos(',tan:'tan(',log:'log(',ln:'ln(',x2:'²',inv:'⁻¹',pow:'^',lp:'(',rp:')',comma:',',div:'÷',mul:'×',sub:'−',add:'+',neg:'-',dot:'.',xt:'X',sto:'→'};
for(let i=0;i<10;i++)M[i]=''+i;
const S={
  sin:'sin⁻¹(',cos:'cos⁻¹(',tan:'tan⁻¹(',pow:'π',x2:'√(',comma:'ᴇ',div:'e',
  log:'10^(',ln:'e^(',neg:'Ans',mul:'[',sub:']',lp:'{',rp:'}',dot:'i',
  '1':'L1','2':'L2','3':'L3','4':'L4','5':'L5','6':'L6'
};

const isV=s=>/^[A-Zθ]$/.test(s||'');
const isLst=s=>/^L[1-6]$/.test(s||'');
let mode='home',S2=0,A=0,ALOCK=0,off=0,deg=0,buf=[],cur=0,hist=[],last=[],ans=0,V={},mm,tr=0,tx=47,tf=0,t0=0;
let x0=-10,x1=10,xscl=1,y0=-10,y1=10,yscl=1,xres=1;
let zPrev=[-10,10,1,-10,10,1],zUser=[-10,10,1,-10,10,1],zFact=[4,4];
let zBoxStep=0,zBoxP1=null,gx=47,gy=31,gCur=0;

const toks=s=>[...s];
const Ys={n:['Y1=','Y2=','Y3=','Y4=','Y5=','Y6='],t:[[],[],[],[],[],[]],on:[1,1,1,1,1,1],i:0,top:0};
const Wn={
  n:['Xmin=','Xmax=','Xscl=','Ymin=','Ymax=','Yscl=','Xres='],
  t:[toks('-10'),toks('10'),toks('1'),toks('-10'),toks('10'),toks('1'),toks('1')],
  i:0,top:0,title:'WINDOW'
};
const Tb={
  n:['TblStart=','ΔTbl=','Indpnt:','Depend:'],
  t:[toks('0'),toks('1'),[],[]],
  auto:[1,1],i:0,top:0,title:'TABLE SETUP'
};
let L=Ys;
const ed=()=>mode==='list'?L.t[L.i]:mode==='pedit'?PG[PN][PL]:(mode==='medit'||mode==='sedit'||mode==='form')?eb:buf;

// Complex number helpers
const isC=v=>v&&typeof v==='object'&&'re' in v&&'im' in v;
const cplx=(re,im=0)=>Math.abs(im)<1e-13?re:{re,im};
const toC=v=>isC(v)?v:{re:v,im:0};
const cAdd=(a,b,s=1)=>{a=toC(a);b=toC(b);return cplx(a.re+s*b.re,a.im+s*b.im)};
const cMul=(a,b)=>{a=toC(a);b=toC(b);return cplx(a.re*b.re-a.im*b.im,a.re*b.im+a.im*b.re)};
const cDiv=(a,b)=>{a=toC(a);b=toC(b);const d=b.re*b.re+b.im*b.im;if(d===0)throw'DIVIDE BY 0';return cplx((a.re*b.re+a.im*b.im)/d,(a.im*b.re-a.re*b.im)/d)};
const cAbs=a=>{a=toC(a);return Math.hypot(a.re,a.im)};
const cArg=a=>{a=toC(a);const r=Math.atan2(a.im,a.re);return deg?r*180/Math.PI:r};
const cSqrt=a=>{
  if(!isC(a)){if(a>=0)return Math.sqrt(a);if(MO.v[6]===0)throw'NONREAL ANS';return cplx(0,Math.sqrt(-a))}
  const r=Math.hypot(a.re,a.im),th=Math.atan2(a.im,a.re)/2;
  return cplx(Math.sqrt(r)*Math.cos(th),Math.sqrt(r)*Math.sin(th));
};
const cPow=(a,b)=>{
  if(!isC(a)&&!isC(b)){if(a<0&&!Number.isInteger(b)){if(MO.v[6]===0)throw'NONREAL ANS';a=toC(a)}else return a**b}
  a=toC(a);b=toC(b);const r=Math.hypot(a.re,a.im);if(r===0)return 0;
  const th=Math.atan2(a.im,a.re),lnR=Math.log(r);
  const mag=Math.exp(b.re*lnR-b.im*th),ang=b.im*lnR+b.re*th;
  return cplx(mag*Math.cos(ang),mag*Math.sin(ang));
};

function fmtNum(n){
  if(Math.abs(n)<1e-13)n=0;
  const a=Math.abs(n),M0=MO.v[0],F0=MO.v[1];
  if(n&&(M0===1||M0===2)){
    const q=M0===2?3:1;
    let e=Math.floor(Math.log10(a));
    if(q===3)e=Math.floor(e/3)*3;
    let m=+(n/10**e).toPrecision(10);
    if(Math.abs(m)>=10**q){m/=10**q;e+=q}
    return String(m)+'ᴇ'+e;
  }
  if(F0>0&&a<1e10)return n.toFixed(F0-1);
  if(n&&(a>=1e10||a<1e-3)){
    let[m,e]=n.toExponential(9).split('e');
    m=m.replace(/\.?0+$/,'');
    return m+'ᴇ'+(+e);
  }
  return String(+n.toPrecision(10));
}

function fmt(v){
  if(isC(v)){
    if(MO.v[6]===2){
      const r=cAbs(v),th=cArg(v);
      return `${fmtNum(r)}e^(${fmtNum(th)}i)`;
    }
    const re=Math.abs(v.re)<1e-13?0:v.re,im=Math.abs(v.im)<1e-13?0:v.im;
    if(!im)return fmtNum(re);
    const imStr=(Math.abs(im)===1?(im<0?'-':''):fmtNum(im))+'i';
    if(!re)return imStr;
    return fmtNum(re)+(im>0?'+':'')+imStr;
  }
  if(Array.isArray(v)&&!Array.isArray(v[0]))return '{'+v.map(fmtNum).join(' ')+'}';
  return fmtNum(v);
}

function toFrac(x){
  if(typeof x!=='number'||!isFinite(x))return fmt(x);
  if(Number.isInteger(x))return String(x);
  const s=x<0?'-':'',v=Math.abs(x);
  let h1=1,h2=0,k1=0,k2=1,b=v;
  for(let i=0;i<22;i++){
    const a=Math.floor(b);
    let t=h1;h1=a*h1+h2;h2=t;
    t=k1;k1=a*k1+k2;k2=t;
    if(Math.abs(v-h1/k1)<1e-10||k1>9999)break;
    b=1/(b-a);
  }
  return k1>9999?fmt(x):`${s}${h1}/${k1}`;
}

function toDMS(x){
  if(typeof x!=='number'||!isFinite(x))return fmt(x);
  const s=x<0?'-':'',a=Math.abs(x);
  const d=Math.floor(a),mF=(a-d)*60,m=Math.floor(mF),sec=+((mF-m)*60).toFixed(2);
  return `${s}${d}°${m}'${sec}"`;
}

const isLstArr=v=>Array.isArray(v)&&(!v.length||!Array.isArray(v[0]));
const lstMap=(a,b,fn)=>{
  if(isLstArr(a)&&isLstArr(b)){if(a.length!==b.length)throw'DIM MISMATCH';return a.map((x,i)=>fn(x,b[i]))}
  if(isLstArr(a))return a.map(x=>fn(x,b));
  if(isLstArr(b))return b.map(y=>fn(a,y));
  return fn(a,b);
};
const fact=n=>{if(n<0||!Number.isInteger(n)||n>170)throw'DOMAIN';let r=1;for(let i=2;i<=n;i++)r*=i;return r};
const nPr=(n,r)=>{if(n<0||r<0||r>n||!Number.isInteger(n)||!Number.isInteger(r))throw'DOMAIN';let res=1;for(let i=0;i<r;i++)res*=(n-i);return res};
const nCr=(n,r)=>{if(n<0||r<0||r>n||!Number.isInteger(n)||!Number.isInteger(r))throw'DOMAIN';return Math.round(nPr(n,r)/fact(r))};

function ev(t){
  let p=0;const k=deg?Math.PI/180:1,pk=()=>t[p],nx=()=>t[p++];
  const F={
    'sin(':x=>isLstArr(x)?x.map(v=>Math.sin(v*k)):Math.sin(x*k),
    'cos(':x=>isLstArr(x)?x.map(v=>Math.cos(v*k)):Math.cos(x*k),
    'tan(':x=>isLstArr(x)?x.map(v=>Math.tan(v*k)):Math.tan(x*k),
    'sin⁻¹(':x=>{if(Math.abs(x)>1&&MO.v[6]===0)throw'DOMAIN';return Math.asin(x)/k},
    'cos⁻¹(':x=>{if(Math.abs(x)>1&&MO.v[6]===0)throw'DOMAIN';return Math.acos(x)/k},
    'tan⁻¹(':x=>Math.atan(x)/k,
    'log(':x=>{if(x<=0&&MO.v[6]===0)throw'DOMAIN';return Math.log10(x)},
    'ln(':x=>{if(x<=0&&MO.v[6]===0)throw'DOMAIN';return Math.log(x)},
    '√(':x=>isLstArr(x)?x.map(cSqrt):cSqrt(x),
    '³√(':x=>isLstArr(x)?x.map(Math.cbrt):Math.cbrt(x),
    'e^(':x=>isC(x)?cPow(Math.E,x):Math.exp(x),
    '10^(':x=>isC(x)?cPow(10,x):10**x,
    'abs(':x=>isLstArr(x)?x.map(cAbs):cAbs(x),
    'int(':x=>isLstArr(x)?x.map(Math.floor):Math.floor(x),
    'iPart(':x=>isLstArr(x)?x.map(Math.trunc):Math.trunc(x),
    'fPart(':x=>isLstArr(x)?x.map(v=>v-Math.trunc(v)):x-Math.trunc(x),
    'round(':(x,n=9)=>isLstArr(x)?x.map(v=>+v.toFixed(n)):+x.toFixed(n),
    'min(':(a,b)=>b===undefined?Math.min(...a):Math.min(a,b),
    'max(':(a,b)=>b===undefined?Math.max(...a):Math.max(a,b),
    'lcm(':(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));const g=(x,y)=>y?g(y,x%y):x;return a&&b?(a*b)/g(a,b):0},
    'gcd(':(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));const g=(x,y)=>y?g(y,x%y):x;return g(a,b)},
    'not(':x=>+!x,
    'conj(':x=>{x=toC(x);return cplx(x.re,-x.im)},
    'real(':x=>toC(x).re,
    'imag(':x=>toC(x).im,
    'angle(':x=>cArg(x),
    'mean(':a=>sm(a)/a.length,
    'median(':a=>med(a),
    'sum(':a=>sm(a),
    'prod(':a=>a.reduce((x,y)=>x*y,1),
    'stdDev(':a=>sdv(a,1),
    'variance(':a=>sdv(a,1)**2,
    'ΔList(':a=>a.slice(1).map((v,i)=>v-a[i]),
    'SortA(':a=>{a.sort((x,y)=>x-y);return a},
    'SortD(':a=>{a.sort((x,y)=>y-x);return a},
    ...FD,
    'R▶Pr(':(x,y)=>Math.hypot(x,y),
    'R▶Pθ(':(x,y)=>Math.atan2(y,x)/k,
    'P▶Rx(':(r,t)=>r*Math.cos(t*k),
    'P▶Ry(':(r,t)=>r*Math.sin(t*k),
    'det(':det,
    'dim(':m=>isLstArr(m)?m.length:[[m.length,m[0].length]],
    'Fill(':(n,m)=>{if(isLstArr(m)){m.fill(n);return m}m.forEach(r=>r.fill(n));return m},
    'identity(':idn,
    'randM(':(r,c)=>Array.from({length:r},()=>Array.from({length:c},()=>Math.floor(Math.random()*19)-9)),
    'randInt(':(a,b,n)=>{const f=()=>Math.floor(Math.random()*(b-a+1))+a;return n?Array.from({length:n},f):f()},
    'randNorm(':(m,s,n)=>{const f=()=>{const u=1-Math.random(),v=Math.random();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};return n?Array.from({length:n},f):f()},
    'randBin(':(tr,pr,n)=>{const f=()=>{let c=0;for(let i=0;i<tr;i++)if(Math.random()<pr)c++;return c};return n?Array.from({length:n},f):f()},
    'augment(':(a,b)=>{if(isLstArr(a)&&isLstArr(b))return a.concat(b);if(a.length!==b.length)throw'DIM MISMATCH';return a.map((r,i)=>r.concat(b[i]))},
    'ref(':m=>rr(m,0),
    'rref(':m=>rr(m,1),
    'rowSwap(':(m,a,b)=>{ck(m,a,b);m=m.map(x=>x.slice());[m[a-1],m[b-1]]=[m[b-1],m[a-1]];return m},
    'row+(':(m,a,b)=>rw(m,1,a,b),
    '*row(':(k,m,r)=>{ck(m,r);m=m.map(x=>x.slice());m[r-1]=m[r-1].map(x=>x*k);return m},
    '*row+(':(k,m,a,b)=>rw(m,k,a,b),
    'cumSum(':m=>isLstArr(m)?m.map((_,i)=>sm(m.slice(0,i+1))):m.map((r,i)=>r.map((x,j)=>{let s=0;for(let k=0;k<=i;k++)s+=m[k][j];return s})),
    'Matr▶list(':(m,...ls)=>{if(!isM(m))throw'DATA TYPE';ls.forEach((l,j)=>{if(isLstArr(l)){l.length=0;m.forEach(r=>l.push(r[j]||0))}});return m.map(r=>r[0])},

function drl(c,a,b){

  let e=dx+dy,k=0;

    if((x===b[0]&&y===b[1])||++k>400)break;

    if(e2>=dy){e+=dy;x+=sx}

function ppl(c,w,hh){
  const T=MO.v[3],E2=deg?360:2*Math.PI,ox=V.X,sx=x=>Math.round((x-x0)*94/w),sy=y=>Math.round((y1-y)*62/hh);

    if(g.some(i=>!Ys.t[i].length||!Ys.on[i]))return;
    let pp=null;
    for(let k=0;k<=240;k++){
      const th=E2*k/240;V.X=th;let x,y;
      try{
        if(T===1){x=ev(Ys.t[g[0]]);y=ev(Ys.t[g[1]])}
        else{const r=ev(Ys.t[g[0]]),a=deg?th*Math.PI/180:th;x=r*Math.cos(a);y=r*Math.sin(a)}

  return 1;
}

  }else if(mode==='tm')s.innerHTML=tmr();
  else if(mode==='mode')s.innerHTML=mor();
  else if(mode==='form')s.innerHTML=formr();
  else if(mode==='txt')s.textContent=TX.l.slice(TX.o,TX.o+8).map(x=>x.slice(0,16)).join('\n');
  else if(mode==='sim')s.textContent=simr();
  else if(mode==='pedit')s.innerHTML=per();
  else if(mode==='sedit')s.innerHTML=ser();
  else if(mode==='mx')s.innerHTML=mxr();
  else if(mode==='medit')s.innerHTML=mer();
  else if(mode==='table'){
    const o=['X       Y1'],ox=V.X;
    for(let i=0;i<7;i++){
      const x=tbv(0)+(t0+i)*tbv(1);
      let y='';try{V.X=x;y=fmt(ev(Ys.t[0])).slice(0,8)}catch(e){}
      o.push(fmt(x).padEnd(8)+y);
    }
    V.X=ox;s.textContent=o.join('\n');
  }
}

function plot(){
  const c=$('#g').getContext('2d');
  c.clearRect(0,0,96,64);
  c.fillStyle='#1e2a1c';
  const w=x1-x0,hh=y1-y0,Y=y=>Math.round((y1-y)*62/hh),ax=Math.round(-x0*94/w);
  if(!FO[3]){
    if(y0<=0&&y1>=0)c.fillRect(0,Y(0),95,1);
    if(x0<=0&&x1>=0)c.fillRect(ax,0,1,63);
  }
  if(FO[2]&&w/xscl<=50&&hh/yscl<=50){
    for(let i=Math.ceil(x0/xscl)*xscl;i<=x1;i+=xscl)
      for(let j=Math.ceil(y0/yscl)*yscl;j<=y1;j+=yscl)
        c.fillRect(Math.round((i-x0)*94/w),Y(j),1,1);
  }
  if(w/xscl<=50&&hh/yscl<=50){
    if(y0<=0&&y1>=0)for(let i=Math.ceil(x0/xscl)*xscl;i<=x1;i+=xscl)c.fillRect(Math.round((i-x0)*94/w),Y(0)-1,1,3);
    if(x0<=0&&x1>=0)for(let i=Math.ceil(y0/yscl)*yscl;i<=y1;i+=yscl)c.fillRect(ax-1,Y(i),3,1);
  }
  const ox=V.X;
  if(MO.v[3]>0)ppl(c,w,hh);
  else Ys.t.forEach((t,idx)=>{
    if(!t.length||!Ys.on[idx])return;
    let py=null;
    const step=Math.max(1,Math.min(8,Math.round(xres)||1));
    for(let p=0;p<95;p+=step){
      let y;try{V.X=x0+p*w/94;y=ev(t)}catch(e){py=null;continue}
      if(!isFinite(y)){py=null;continue}
      const q=Y(y);if(Math.abs(q)>500){py=null;continue}
      const a=py===null||MO.v[4]?q:Math.min(py,q),b=py===null||MO.v[4]?q:Math.max(py,q);
      c.fillRect(p,a,1,b-a+1);py=q;
    }
  });
  V.X=ox;drw(c,w,hh);
}

function setWin(){Wn.t=[x0,x1,xscl,y0,y1,yscl,xres].map(v=>toks(fmt(v)))}
function graph(){
  try{
    [x0,x1,xscl,y0,y1,yscl,xres]=Wn.t.map(t=>ev(t));
    if(!(x0<x1&&y0<y1&&xscl>0&&yscl>0))throw 0;
  }catch(e){mode='home';hist.push({l:'ERR:WINDOW RANGE'});draw();return 0}
  mode='graph';tr=0;gCur=0;plot();draw();return 1;
}
function trace(){
  let t=Ys.t[tf];
  if(!t||!t.length||!Ys.on[tf]){tf=Ys.t.findIndex((a,i)=>a.length&&Ys.on[i]);if(tf<0){tr=0;return draw()}}
  plot();
  const c=$('#g').getContext('2d'),ox=V.X;
  V.X=x0+tx*(x1-x0)/94;
  let y;try{y=ev(Ys.t[tf])}catch(e){y=NaN}
  const py=isFinite(y)?Math.round((y1-y)*62/(y1-y0)):31;
  c.fillRect(tx-3,py,7,1);c.fillRect(tx,py-3,1,7);
  const hdr=FO[5]?'':`Y${tf+1}:${Ys.t[tf].join('').slice(0,12)}\n`;
  if(FO[0]){
    const r=Math.hypot(V.X,y),th=Math.atan2(y,V.X)*(deg?180/Math.PI:1);
    $('#tr').textContent=`${hdr}R=${fmt(r)}\nθ=${isFinite(th)?fmt(th):''}`;
  }else{
    $('#tr').textContent=`${hdr}X=${fmt(V.X)}\nY=${isFinite(y)?fmt(y):''}`;
  }
  V.X=ox;draw();
}
function moveFreeCursor(){
  plot();
  const c=$('#g').getContext('2d');
  c.fillRect(gx-3,gy,7,1);c.fillRect(gx,gy-3,1,7);
  const x=x0+gx*(x1-x0)/94,y=y1-gy*(y1-y0)/62;
  if(!FO[1])$('#tr').textContent=`X=${fmt(x)}\nY=${fmt(y)}`;
  draw();
}
function zoom(a,b,c,d,xs=xscl,ys=yscl){
  zPrev=[x0,x1,xscl,y0,y1,yscl];
  x0=a;x1=b;xscl=xs;y0=c;y1=d;yscl=ys;
  setWin();graph();
}

function enterHome(){
  const t=buf.slice();if(!t.length)return;
  hist.push({l:t.join('')});last=t;
  if(t.length===1&&t[0].startsWith('prgm')){buf=[];cur=0;const P=PG[t[0].slice(4)];if(P)go(P);return}
  try{
    let postFmt=null,e=t;
    if(['►Frac','►Dec','▶DMS'].includes(e[e.length-1])){postFmt=e[e.length-1];e=e.slice(0,-1)}
    let i=e.lastIndexOf('→'),dest;
    if(i>=0){
      dest=e[i+1];e=e.slice(0,i);
      if(!(isV(dest)||isMt(dest)||isLst(dest))||e.length===0)throw'SYNTAX';
    }
    dflag=0;const v=ev(e);
    if(dflag){const f=dflag;dflag=0;buf=[];cur=0;if(f===2)hist.push({l:'Done'});else graph();return}
    if(isM(v)&&Array.isArray(v[0])){
      if(dest&&!isMt(dest))throw'DATA TYPE';
      ans=v;if(dest)Mx[dest[1]]=v.map(r=>r.slice());
      hist.push(...mfmt(v));
    }else if(isLstArr(v)){
      if(dest&&!isLst(dest))throw'DATA TYPE';
      ans=v;if(dest)Lst[+dest[1]-1]=v.slice();
      hist.push({r:fmt(v)});
    }else{
      if(!isC(v)&&!isFinite(v))throw'DOMAIN';
      if(dest&&(isMt(dest)||isLst(dest)))throw'DATA TYPE';
      ans=v;if(dest)V[dest]=v;
      const out=postFmt==='►Frac'?toFrac(v):postFmt==='▶DMS'?toDMS(v):fmt(v);
      hist.push({r:out});
    }
  }catch(x){hist.push({l:'ERR:'+(typeof x==='string'?x:'SYNTAX')})}
  if(hist.length>60)hist.splice(0,20);
  buf=[];cur=0;
}

function arrow(id){
  if(arrowX(id))return draw();
  const d={u:-1,dn:1,l:-1,r:1}[id],v=id==='u'||id==='dn',cl=a=>Math.max(0,Math.min(a.length,cur+d));
  if(mode==='home'){
    if(v){if(id==='u'&&!buf.length&&last.length){buf=last.slice();cur=buf.length}}
    else cur=cl(buf);
  }else if(mode==='list'){
    if(v){
      L.i=(L.i+d+L.n.length)%L.n.length;
      cur=L.t[L.i].length;
    }else if(L===Ys){
      cur=Math.max(-1,Math.min(L.t[L.i].length,cur+d));
    }else if(L===Tb&&L.i>=2){
      L.auto[L.i-2]^=1;
    }else{
      cur=cl(L.t[L.i]);
    }
  }else if(mode==='mx'){
    if(v)mxs=(mxs+d+mxn())%mxn();
    else{MT=(MT+d+3)%3;mxs=0}
  }else if(mode==='medit')mnav(id);
  else if(mode==='table'){if(v)t0+=d}
  else if(mode==='graph'){
    if(tr){
      if(v){for(let n=0;n<6;n++){tf=(tf+d+6)%6;if(Ys.t[tf].length&&Ys.on[tf])break}}
      else tx=Math.max(0,Math.min(94,tx+d));
      return trace();
    }else{
      gCur=1;
      if(v)gy=Math.max(0,Math.min(62,gy+d));
      else gx=Math.max(0,Math.min(94,gx+d));
      return moveFreeCursor();
    }
  }
  draw();
}

function press(id){
  const s2=S2,al=A||ALOCK;
  S2=0;A=0;
  if(off){if(id==='on'&&!s2)off=0;return draw()}
  if(id==='2nd'){S2=!s2;return draw()}
  if(id==='alpha'){if(s2){ALOCK=1}else if(ALOCK){ALOCK=0}else{A=!al}return draw()}
  if(keyX(id,s2,al))return draw();

  if(mode==='mx'){
    const a=(KM[id]||{}).a;
    let k=al?'ABCDEF'.indexOf(a||'-'):'1234567890'.indexOf(id);
    if(al&&k>=0)k+=10;
    if(k>=0&&k<mxn())return msel(k);
  }
  if(id==='on'){if(run){run=null;hist.push({l:'ERR:BREAK'})}else if(s2)off=1;return draw()}
  if(['u','dn','l','r'].includes(id))return arrow(id);
  if(id==='inv'&&s2){mb=mode==='list'?'list':'home';MT=0;mxs=0;mode='mx';return draw()}
  if(id==='y'||id==='win'){L=id==='y'?Ys:Wn;L.i=0;mode='list';cur=L.t[0].length;return draw()}
  if(id==='graph'){if(s2){mode='table';t0=0;return draw()}return void graph()}
  if(id==='zoom'){
    const w=(x1-x0)/2,h=(y1-y0)/2,cx=(x0+x1)/2,cy=(y0+y1)/2;
    const tSpan=deg?360:2*Math.PI,tScl=deg?90:Math.PI/2;
    tmo(['ZOOM','MEMORY'],[
      ['Zoom In','Zoom Out','ZDecimal','ZSquare','ZStandard','ZTrig','ZInteger','ZoomStat','ZoomFit'],
      ['ZPrevious','ZoomSto','ZoomRcl','SetFactors...']
    ],(t,i)=>{
      if(t===1){
        if(i===0)zoom(...zPrev);
        else if(i===1){zUser=[x0,x1,xscl,y0,y1,yscl];mode='graph';plot()}
        else if(i===2)zoom(...zUser);
        else openForm('ZOOM FACTORS',['XFact=','YFact='],[zFact[0],zFact[1]],()=>{zFact=FM.vals.map(v=>Math.max(1,ev(v)));mode='graph';plot()});
        return;
      }
      if(i===0)zoom(cx-w/zFact[0],cx+w/zFact[0],cy-h/zFact[1],cy+h/zFact[1]);
      else if(i===1)zoom(cx-w*zFact[0],cx+w*zFact[0],cy-h*zFact[1],cy+h*zFact[1]);
      else if(i===2)zoom(-4.7,4.7,1,-3.1,3.1,1);
      else if(i===3){const asp=94/62,r=h*asp;zoom(cx-r,cx+r,y0,y1)}
      else if(i===4)zoom(-10,10,1,-10,10,1);
      else if(i===5)zoom(-tSpan,tSpan,tScl,-4,4,1);
      else if(i===6)zoom(Math.round(cx)-47,Math.round(cx)+47,10,Math.round(cy)-31,Math.round(cy)+31,10);
      else if(i===7){const[xs,ys]=pr();if(!xs.length)return;SP.on=1;const a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys),mx=(b-a||1)*.1,my=(d-c||1)*.1;zoom(a-mx,b+mx,xscl,c-my,d+my,yscl)}
      else if(i===8){
        let mn=Infinity,mx=-Infinity;const ox=V.X;
        for(let k=0;k<=94;k++){V.X=x0+k*(x1-x0)/94;Ys.t.forEach((fn,idx)=>{if(fn.length&&Ys.on[idx])try{const y=ev(fn);if(isFinite(y)){mn=Math.min(mn,y);mx=Math.max(mx,y)}}catch(e){}})}
        V.X=ox;if(isFinite(mn)&&isFinite(mx))zoom(x0,x1,xscl,mn===mx?mn-1:mn,mn===mx?mx+1:mx,yscl);
      }
    });
    return draw();
  }
  if(id==='trace'){if(mode!=='graph'&&!graph())return;tr=1;gCur=0;return trace()}
  if(id==='clear'){
    if(mode==='home'){if(buf.length){buf=[];cur=0}else hist=[]}
    else if(mode==='list'&&L!==Tb){L.t[L.i]=[];cur=0}
    else mode='home';
    return draw();
  }
  if(id==='enter'){
    if(mode==='mx')return msel(mxs);
    if(mode==='medit'){mcommit();return draw()}
    if(mode==='list'){
      if(L===Ys&&cur===-1){L.on[L.i]^=1;return draw()}
      if(L===Tb&&L.i>=2){L.auto[L.i-2]^=1;return draw()}
      L.i=(L.i+1)%L.n.length;cur=L.t[L.i].length;return draw();
    }
    if(mode!=='home'){mode='home';return draw()}
    if(s2){buf=last.slice();cur=buf.length}
    else enterHome();
    return draw();
  }
  if(mode==='graph'||mode==='table')mode='home';
  if(id==='del'){
    if(s2){INS=!INS;return draw()}
    const a=ed();if(cur<a.length)a.splice(cur,1);
    return draw();
  }
  const t=al
    ?(KM[id].a==='␣'?' ':(KM[id].a.length===1&&'ABCDEFGHIJKLMNOPQRSTUVWXYZθ":?'.includes(KM[id].a)?KM[id].a:null))
    :s2?S[id]:M[id];
  if(t){
    if((mode==='medit'||mode==='sedit'||mode==='form')&&fresh){eb=[];cur=0;fresh=0}
    put(t);
  }
  draw();
}

let AC;
function clk(){
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,sr=AC.sampleRate,rnd=0.94+Math.random()*0.12;

    // Light, dry, micro-short keycap click (no bass thump, no harsh high-frequency zing)
    const len=Math.floor(sr*0.022),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0);
    const tick=(at,amp,tau)=>{
      const a=Math.floor(at*sr),n=Math.floor(sr*0.005);
      for(let i=0;i<n&&a+i<len;i++){
        d[a+i]+=(Math.random()*2-1)*amp*Math.exp(-i/(sr*tau));
      }
    };
    tick(0,1.0,0.00085);
    tick(0.011,0.3,0.00075);

    const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=b;
    bp.type='bandpass';
    bp.frequency.value=1350*rnd;
    bp.Q.value=2.4;
    g.gain.value=0.095;
    s.connect(bp);
    bp.connect(g);
    g.connect(AC.destination);
    s.start(t);
  }catch(e){}
}

$('#k').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  clk();navigator.vibrate&&navigator.vibrate(4);press(b.dataset.k);
});

// Physical keyboard support
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  let id=null;
  if(k>='0'&&k<='9')id=k;
  else if(k==='+')id='add';
  else if(k==='-')id='sub';
  else if(k==='*')id='mul';
  else if(k==='/')id='div';
  else if(k==='^')id='pow';
  else if(k==='(')id='lp';
  else if(k===')')id='rp';
  else if(k===',')id='comma';
  else if(k==='.')id='dot';
  else if(k==='Enter')id='enter';
  else if(k==='Backspace')id='del';
  else if(k==='Escape')id='clear';
  else if(k==='ArrowUp')id='u';
  else if(k==='ArrowDown')id='dn';
  else if(k==='ArrowLeft')id='l';
  else if(k==='ArrowRight')id='r';
  else if((A||ALOCK)&&/^[a-zA-Z]$/.test(k)){
    const up=k.toUpperCase();
    const found=Object.entries(KM).find(([,v])=>v.a===up);
    if(found)id=found[0];
  }else if(k.toUpperCase()==='X')id='xt';
  if(id){e.preventDefault();clk();press(id)}
});

draw();
</script>
